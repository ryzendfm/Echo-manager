<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aurora Enhanced</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --bg: #07030f;
  }

  html, body {
    width: 100%;
    height: 100%;
    background:
      radial-gradient(1200px 500px at 50% -10%, rgba(80, 30, 140, 0.18), transparent 60%),
      radial-gradient(900px 400px at 10% 0%, rgba(40, 20, 90, 0.18), transparent 60%),
      linear-gradient(to bottom, #05020b, var(--bg) 55%, #04020a 100%);
    overflow: hidden;
  }

  .aurora {
    position: fixed;
    inset: 0 0 auto 0;
    width: 100%;
    height: 64vh;
    overflow: hidden;
    isolation: isolate;
  }

  .blob {
    position: absolute;
    border-radius: 50%;
    mix-blend-mode: screen;
    will-change: transform, opacity, filter;
    transform-origin: center center;
  }

  .blob-1 {
    width: 100vw;
    height: 52vh;
    background: radial-gradient(ellipse at center,
      rgba(180, 90, 255, 0.68) 0%,
      rgba(110, 40, 210, 0.30) 45%,
      transparent 70%);
    filter: blur(75px);
  }

  .blob-2 {
    width: 72vw;
    height: 58vh;
    background: radial-gradient(ellipse at center,
      rgba(90, 30, 230, 0.72) 0%,
      rgba(55, 15, 155, 0.32) 45%,
      transparent 70%);
    filter: blur(82px);
  }

  .blob-3 {
    width: 65vw;
    height: 46vh;
    background: radial-gradient(ellipse at center,
      rgba(215, 145, 255, 0.52) 0%,
      rgba(155, 75, 245, 0.22) 50%,
      transparent 70%);
    filter: blur(62px);
  }

  .blob-4 {
    width: 82vw;
    height: 42vh;
    background: radial-gradient(ellipse at center,
      rgba(55, 8, 185, 0.58) 0%,
      rgba(28, 4, 88, 0.22) 55%,
      transparent 70%);
    filter: blur(92px);
  }

  .blob-5 {
    width: 50vw;
    height: 44vh;
    background: radial-gradient(ellipse at center,
      rgba(205, 75, 255, 0.44) 0%,
      rgba(145, 38, 205, 0.20) 50%,
      transparent 70%);
    filter: blur(58px);
  }

  .blob-6 {
    width: 60vw;
    height: 38vh;
    background: radial-gradient(ellipse at center,
      rgba(130, 50, 255, 0.38) 0%,
      rgba(80, 20, 180, 0.16) 50%,
      transparent 70%);
    filter: blur(68px);
  }

  /* Aurora curtain streaks */
  .curtain {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    opacity: 0.18;
    mix-blend-mode: screen;
    background:
      repeating-linear-gradient(
        100deg,
        rgba(210, 150, 255, 0.00) 0px,
        rgba(210, 150, 255, 0.04) 18px,
        rgba(120, 60, 255, 0.09) 42px,
        rgba(255, 255, 255, 0.02) 58px,
        rgba(210, 150, 255, 0.00) 86px
      );
    filter: blur(22px);
    transform: translateY(-4%) scaleY(1.1);
    animation: curtainShift 14s ease-in-out infinite alternate;
  }

  @keyframes curtainShift {
    0%   { transform: translateX(-2%) translateY(-4%) scaleY(1.08) skewX(-4deg); }
    100% { transform: translateX(2%) translateY(-1%) scaleY(1.16) skewX(4deg); }
  }

  /* Dissolve edge */
  .aurora::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 52%;
    background: linear-gradient(to bottom, transparent, rgba(7, 3, 15, 0.72), #07030f);
    pointer-events: none;
    z-index: 8;
  }

  /* Glow haze */
  .aurora::before {
    content: '';
    position: absolute;
    inset: -10% -10% 20% -10%;
    background:
      radial-gradient(ellipse at 50% 20%, rgba(160, 90, 255, 0.10), transparent 55%),
      radial-gradient(ellipse at 25% 10%, rgba(90, 40, 220, 0.08), transparent 50%),
      radial-gradient(ellipse at 80% 15%, rgba(210, 110, 255, 0.07), transparent 45%);
    filter: blur(60px);
    z-index: 1;
    pointer-events: none;
  }

  /* Twinkle / shimmer overlay */
  .shimmer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 12;
    opacity: 0.08;
    mix-blend-mode: screen;
    background:
      radial-gradient(circle at 20% 18%, rgba(255,255,255,0.9) 0 1px, transparent 2px),
      radial-gradient(circle at 38% 12%, rgba(220,190,255,0.9) 0 1px, transparent 2px),
      radial-gradient(circle at 63% 22%, rgba(255,255,255,0.8) 0 1px, transparent 2px),
      radial-gradient(circle at 79% 16%, rgba(210,160,255,0.9) 0 1px, transparent 2px),
      radial-gradient(circle at 55% 8%, rgba(255,255,255,0.8) 0 1px, transparent 2px);
    animation: shimmerPulse 6s ease-in-out infinite alternate;
  }

  @keyframes shimmerPulse {
    0%   { opacity: 0.04; transform: translateY(0px); }
    100% { opacity: 0.10; transform: translateY(3px); }
  }

  /* Grain */
  .grain {
    position: fixed;
    inset: 0;
    z-index: 20;
    pointer-events: none;
    opacity: 0.04;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 180px 180px;
    animation: grainShift 0.35s steps(2) infinite;
  }

  @keyframes grainShift {
    0%   { transform: translate(0, 0); }
    25%  { transform: translate(-0.5%, 0.3%); }
    50%  { transform: translate(0.4%, -0.4%); }
    75%  { transform: translate(-0.2%, 0.2%); }
    100% { transform: translate(0, 0); }
  }

  /* Vignette */
  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 18;
    background:
      radial-gradient(ellipse at center,
        transparent 45%,
        rgba(0,0,0,0.10) 72%,
        rgba(0,0,0,0.22) 100%);
  }

  @media (prefers-reduced-motion: reduce) {
    .curtain, .grain, .shimmer {
      animation: none !important;
    }
    .blob {
      transition: opacity 1.2s ease;
    }
  }
</style>
</head>
<body>
  <div class="aurora">
    <div class="blob blob-1" id="b1"></div>
    <div class="blob blob-2" id="b2"></div>
    <div class="blob blob-3" id="b3"></div>
    <div class="blob blob-4" id="b4"></div>
    <div class="blob blob-5" id="b5"></div>
    <div class="blob blob-6" id="b6"></div>
    <div class="curtain"></div>
  </div>

  <div class="shimmer"></div>
  <div class="vignette"></div>
  <div class="grain"></div>

<script>
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const W = () => window.innerWidth;
  const H = () => window.innerHeight * 0.64;

  const blobs = [
    {
      el: document.getElementById('b1'),
      cx: 0.45, cy: -0.06,
      Ax: 0.30, Ay: 0.10,
      fx: 0.28, fy: 0.14,
      px: 0.0, py: 0.0,
      opBase: 0.80, opAmp: 0.12, opF: 0.20,
      scaleBase: 1.00, scaleAmp: 0.045, scaleF: 0.11,
      hueBase: 0, hueAmp: 10, hueF: 0.05,
      parallax: 10
    },
    {
      el: document.getElementById('b2'),
      cx: 0.68, cy: 0.00,
      Ax: 0.22, Ay: 0.12,
      fx: 0.22, fy: 0.11,
      px: 1.0, py: 0.5,
      opBase: 0.70, opAmp: 0.14, opF: 0.17,
      scaleBase: 1.00, scaleAmp: 0.060, scaleF: 0.10,
      hueBase: 2, hueAmp: 12, hueF: 0.06,
      parallax: 16
    },
    {
      el: document.getElementById('b3'),
      cx: 0.30, cy: -0.02,
      Ax: 0.25, Ay: 0.09,
      fx: 0.35, fy: 0.175,
      px: 2.1, py: 1.0,
      opBase: 0.62, opAmp: 0.16, opF: 0.25,
      scaleBase: 1.00, scaleAmp: 0.055, scaleF: 0.13,
      hueBase: -4, hueAmp: 14, hueF: 0.08,
      parallax: 20
    },
    {
      el: document.getElementById('b4'),
      cx: 0.50, cy: 0.22,
      Ax: 0.38, Ay: 0.08,
      fx: 0.19, fy: 0.095,
      px: 0.8, py: 1.6,
      opBase: 0.58, opAmp: 0.14, opF: 0.15,
      scaleBase: 1.00, scaleAmp: 0.040, scaleF: 0.09,
      hueBase: 6, hueAmp: 10, hueF: 0.04,
      parallax: 8
    },
    {
      el: document.getElementById('b5'),
      cx: 0.75, cy: -0.04,
      Ax: 0.18, Ay: 0.11,
      fx: 0.42, fy: 0.21,
      px: 3.2, py: 0.3,
      opBase: 0.52, opAmp: 0.18, opF: 0.30,
      scaleBase: 1.00, scaleAmp: 0.070, scaleF: 0.17,
      hueBase: -8, hueAmp: 18, hueF: 0.10,
      parallax: 22
    },
    {
      el: document.getElementById('b6'),
      cx: 0.20, cy: 0.10,
      Ax: 0.20, Ay: 0.10,
      fx: 0.31, fy: 0.155,
      px: 1.5, py: 2.4,
      opBase: 0.46, opAmp: 0.14, opF: 0.22,
      scaleBase: 1.00, scaleAmp: 0.050, scaleF: 0.12,
      hueBase: 4, hueAmp: 10, hueF: 0.07,
      parallax: 14
    }
  ];

  let mouse = { x: 0, y: 0 };
  let targetMouse = { x: 0, y: 0 };

  function cacheBlobSizes() {
    blobs.forEach(b => {
      b.bw = b.el.offsetWidth;
      b.bh = b.el.offsetHeight;
    });
  }

  cacheBlobSizes();
  window.addEventListener('resize', cacheBlobSizes);

  window.addEventListener('pointermove', (e) => {
    targetMouse.x = (e.clientX / window.innerWidth - 0.5) * 2;   // -1..1
    targetMouse.y = (e.clientY / window.innerHeight - 0.5) * 2;  // -1..1
  }, { passive: true });

  function tick(ts) {
    const t = ts * 0.001;
    const w = W();
    const h = H();

    // Smooth mouse follow
    mouse.x += (targetMouse.x - mouse.x) * 0.035;
    mouse.y += (targetMouse.y - mouse.y) * 0.035;

    blobs.forEach((b, i) => {
      const x = (b.cx + b.Ax * Math.sin(b.fx * t + b.px)) * w;
      const y = (b.cy + b.Ay * Math.sin(b.fy * t + b.py)) * h;

      const driftX = prefersReducedMotion ? 0 : mouse.x * b.parallax;
      const driftY = prefersReducedMotion ? 0 : mouse.y * (b.parallax * 0.35);

      const scale = prefersReducedMotion
        ? 1
        : b.scaleBase + b.scaleAmp * Math.sin(b.scaleF * t + b.py + i);

      const op = b.opBase + b.opAmp * Math.sin(b.opF * t + b.px);

      const hue = prefersReducedMotion
        ? b.hueBase
        : b.hueBase + b.hueAmp * Math.sin(b.hueF * t + b.py);

      const brightness = 1.0 + 0.10 * Math.sin(0.09 * t + i * 0.7);
      const saturate = 1.05 + 0.08 * Math.sin(0.07 * t + i);

      b.el.style.transform =
        `translate(${x - b.bw * 0.5 + driftX}px, ${y - b.bh * 0.5 + driftY}px) scale(${scale})`;

      b.el.style.opacity = op.toFixed(3);
      b.el.style.filter =
        `blur(${[
          75, 82, 62, 92, 58, 68
        ][i]}px) hue-rotate(${hue.toFixed(2)}deg) brightness(${brightness.toFixed(3)}) saturate(${saturate.toFixed(3)})`;
    });

    requestAnimationFrame(tick);
  }

  if (!prefersReducedMotion) {
    requestAnimationFrame(tick);
  } else {
    // Static but still nicely composed
    const w = W();
    const h = H();
    blobs.forEach((b, i) => {
      const x = (b.cx + b.Ax * Math.sin(b.px)) * w;
      const y = (b.cy + b.Ay * Math.sin(b.py)) * h;
      b.el.style.transform = `translate(${x - b.bw * 0.5}px, ${y - b.bh * 0.5}px)`;
      b.el.style.opacity = b.opBase;
      b.el.style.filter = `blur(${[75,82,62,92,58,68][i]}px)`;
    });
  }
</script>
</body>
</html>
